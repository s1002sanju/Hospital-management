; Production PHP settings (copied into the image as conf.d/zz-app.ini)
display_errors = Off            ; warnings printed into the page break session_start() and redirects
log_errors = On                 ; errors go to Apache's log = Render's Logs tab
expose_php = Off
memory_limit = 256M
upload_max_filesize = 3M
post_max_size = 4M
session.cookie_httponly = 1
session.use_strict_mode = 1
