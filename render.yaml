# Render Blueprint. "sync: false" = you type the value in the Render dashboard (kept out of git).
services:
  - type: web
    name: citycare-hospital
    runtime: docker
    plan: free
    region: singapore            # closest Render region to Supabase ap-south-1 (Mumbai); cannot be changed later
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health.php
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: FORCE_HTTPS
        value: "1"
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: AUTO_MIGRATE          # 1 = run database/supabase_schema.sql on every start (idempotent)
        value: "1"

      # --- Supabase Postgres: Dashboard -> Connect -> "Session pooler" (IPv4, works on Render) ---
      - key: DB_HOST               # e.g. aws-1-ap-south-1.pooler.supabase.com
        sync: false
      - key: DB_PORT               # 5432 = session pooler (recommended)  |  6543 = transaction pooler (also works)
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DB_USER               # postgres.<project-ref>   (NOT just "postgres")
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_SSLMODE
        value: require

      # --- Supabase Storage (medical reports) ---
      - key: SUPABASE_URL          # https://<project-ref>.supabase.co
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY   # server-side only - never expose in the browser
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: medical-reports

      # --- First admin account, created automatically on start ---
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administrator

      # --- Reminder API secret (used by the GitHub Actions schedule) ---
      - key: REMINDER_KEY
        generateValue: true

      # --- Optional email (Render free plan blocks SMTP, so use the Resend HTTPS API) ---
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
