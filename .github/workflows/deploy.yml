name: Deploy to AWS Elastic Beanstalk
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Package, upload and deploy
        run: |
          VERSION=${{ github.sha }}
          zip -r app.zip . -x '.git/*' 'tests/*' 'docs/*' 'storage/*' '.github/*'
          aws s3 cp app.zip s3://${{ secrets.EB_BUCKET }}/hospital/$VERSION.zip
          aws elasticbeanstalk create-application-version --application-name ${{ secrets.EB_APP }} \
            --version-label $VERSION --source-bundle S3Bucket=${{ secrets.EB_BUCKET }},S3Key=hospital/$VERSION.zip
          aws elasticbeanstalk update-environment --environment-name ${{ secrets.EB_ENV }} --version-label $VERSION
